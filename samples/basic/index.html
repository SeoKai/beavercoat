<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beavercoat sample</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="bar"><img class="logo" src="./assets/mark.svg" alt="Dam Coffee"><nav><a href="#menu">메뉴</a><a href="#visit">오시는 길</a></nav></header>
<main>
  <section class="hero" id="top">
    <div>
      <p class="eyebrow">DAM COFFEE</p>
      <h1>천천히 쌓아 올린<br>한 잔의 커피</h1>
      <p class="lead">이 페이지는 beavercoat를 시험하기 위한 가상의 카페 샘플입니다.</p>
      <a class="btn" href="#menu">메뉴 보기</a>
    </div>
    <svg class="dam" viewBox="0 0 240 160" role="img" aria-label="겹겹이 쌓인 통나무 그림">
      <rect x="20" y="96" width="200" height="20" rx="10" fill="#8A5A2B"/>
      <rect x="40" y="70" width="160" height="20" rx="10" fill="#A9743F"/>
      <circle cx="120" cy="40" r="22" fill="#C98A4B"/>
      <path d="M30 136 Q120 110 210 136" fill="none" stroke="#3E7CB1" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </section>
  <section class="menu" id="menu">
    <h2>메뉴</h2>
    <div class="cards">
      <article class="card"><h3>통나무 라테</h3><p>고소한 우유와 진한 에스프레소</p></article>
      <article class="card"><h3>잔물결 드립</h3><p>산뜻한 산미의 핸드 드립</p></article>
      <article class="card"><h3>댐 콜드브루</h3><p>열두 시간 천천히 내린 커피</p></article>
    </div>
  </section>
  <section class="visit" id="visit">
    <div class="slot"></div>
    <div>
      <h2>오시는 길</h2>
      <p>강가 산책로 끝, 나무 다리 옆에 있습니다.</p>
    </div>
  </section>
</main>
<footer class="foot"><p>© Dam Coffee (가상의 브랜드)</p></footer>
</body>
</html>
